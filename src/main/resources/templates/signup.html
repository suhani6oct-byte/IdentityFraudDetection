<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Verification</title>

<style>
    :root {
        --blue: #365bb3;
        --blue-dark: #244486;
        --blue-light: #eaf0ff;
        --background: #f2f5fc;
        --ink: #172747;
        --muted: #7886a1;
        --border: #d5def0;
        --white: #ffffff;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 32px 16px;
        background:
            radial-gradient(circle at 12% 15%, #dce7ff 0, transparent 28%),
            radial-gradient(circle at 90% 85%, #e3eaff 0, transparent 30%),
            var(--background);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--ink);
    }

    .window {
        width: 100%;
        max-width: 460px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 55px rgba(38, 66, 125, 0.13);
    }

    .title-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px 18px;
        background: #f8faff;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
    }

    .app-name {
        display: flex;
        align-items: center;
        gap: 9px;
    }

    .app-icon {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border-radius: 7px;
        background: var(--blue-light);
        color: var(--blue);
        font-size: 15px;
    }

    .window-controls {
        display: flex;
        gap: 5px;
    }

    .window-controls span {
        width: 8px;
        height: 8px;
        border: 1px solid #aab7d0;
        border-radius: 50%;
    }

    .content {
        padding: 34px;
    }

    .security-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border: 1px solid #d8e3ff;
        border-radius: 20px;
        background: linear-gradient(145deg, #eef3ff, #dce7ff);
        color: var(--blue);
        font-size: 30px;
    }

    h1 {
        margin: 0;
        text-align: center;
        font-size: 29px;
        letter-spacing: -0.8px;
    }

    .subtitle {
        margin: 10px 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
    }

    .section-label {
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
    }

    .section-label::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 650;
    }

    .input-wrap {
        position: relative;
    }

    .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: #7188bc;
        font-size: 17px;
        pointer-events: none;
    }

    input[type="text"],
    input[type="email"] {
        width: 100%;
        height: 48px;
        padding: 0 14px 0 42px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #fcfdff;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(54, 91, 179, 0.12);
    }

    input::placeholder {
        color: #a0abc0;
    }

    .create-button {
        width: 100%;
        height: 49px;
        margin-top: 5px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--blue);
        border-radius: 9px;
        background: linear-gradient(135deg, #4169c8, #3154a7);
        color: white;
        font-size: 14px;
        font-weight: 650;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(54, 91, 179, 0.2);
        transition: transform 0.15s, box-shadow 0.15s;
    }

    .create-button:hover {
        background: var(--blue-dark);
        box-shadow: 0 7px 16px rgba(54, 91, 179, 0.25);
        transform: translateY(-1px);
    }

    .create-button:active {
        transform: translateY(0);
    }

    .arrow {
        font-size: 18px;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 25px 0 19px;
        color: #a0abc0;
        font-size: 11px;
        letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
    }

    .security-note {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 13px;
        border: 1px solid #e0e8fb;
        border-radius: 9px;
        background: #f7f9ff;
        color: #697998;
        font-size: 12px;
        line-height: 1.6;
    }

    .note-icon {
        color: var(--blue);
        font-size: 17px;
    }

    .footer {
        padding-top: 23px;
        text-align: center;
        color: #9aa5b9;
        font-size: 11px;
    }

    .website-field {
        position: absolute;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
    }

    @media (max-width: 480px) {
        .content {
            padding: 27px 22px;
        }

        h1 {
            font-size: 25px;
        }
    }
</style>

</head>

<body>
    <main class="window">
        <header class="title-bar">
            <div class="app-name">
                <span class="app-icon" aria-hidden="true">⌑</span>
                <span>IDENTITY SYSTEM <span aria-hidden="true">/</span> SIGNUP.EXE</span>
            </div>

        <div class="window-controls" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="content">
        <div class="security-icon" aria-hidden="true">♙</div>

        <h1>Identity Verification</h1>
        <p class="subtitle">
            A secure start begins here.<br>
            Create your account to continue.
        </p>

        <div class="section-label">Account details</div>

        <form id="signupForm" action="/signup" method="post">
            <div class="field">
                <label for="fullName">Full name</label>
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">♙</span>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <div class="input-wrap">
                    <span class="input-icon" aria-hidden="true">✉</span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <!-- Honeypot: legitimate users should leave this empty. -->
            <div class="website-field" aria-hidden="true">
                <label for="website">Leave this field empty</label>
                <input
                    type="text"
                    id="website"
                    name="website"
                    tabindex="-1"
                    autocomplete="off"
                >
            </div>

            <!-- A client-provided timing signal; validate server-side. -->
            <input
                type="hidden"
                id="formLoadTime"
                name="formLoadTime"
                value=""
            >

            <button class="create-button" type="submit">
                Create Account <span class="arrow">→</span>
            </button>
        </form>

        <div class="divider">SECURE CONNECTION</div>

        <div class="security-note">
            <span class="note-icon" aria-hidden="true">▣</span>
            <span>
                Your information is intended for identity verification.
                Bot-detection checks help protect the signup process.
            </span>
        </div>

        <footer class="footer">
            IDENTITY SYSTEM · VERSION 1.0
        </footer>
    </div>
</main>

<script>
    document.getElementById("formLoadTime").value = Date.now();
</script>

</body>
</html>
