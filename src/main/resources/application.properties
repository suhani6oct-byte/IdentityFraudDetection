spring.application.name=fraud

# H2 database stored in a FILE (folder "data" next to the project), so signups survive restarts.
# AUTO_SERVER lets the H2 console open the same file while the app is running.
spring.datasource.url=jdbc:h2:file:./data/fraud;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
# create the table on first start, then only add what is missing (never wipes data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# optional database viewer at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/fraud;AUTO_SERVER=TRUE   user: sa   password: (empty)
spring.h2.console.enabled=true

# load the 28 sample signups ONLY when the database is empty. Real site: keep false.
fraud.seed-enabled=false